server {
    listen       4321;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compression
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Cohérent avec trailingSlash: 'always' — Astro génère /page/index.html.
    # try_files sert le dossier (donc son index.html) pour les URLs avec slash.
    location / {
        try_files $uri $uri/ =404;
    }

    # Assets versionnés : cache long
    location /assets/ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        try_files   $uri =404;
    }

    # Page 404 personnalisée (src/pages/404.astro -> dist/404.html)
    error_page 404 /404.html;
}
